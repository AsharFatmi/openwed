services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openwed
      POSTGRES_PASSWORD: openwed
      POSTGRES_DB: openwed
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openwed"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://openwed:openwed@db:5432/openwed
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-super@admin.com}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-SuperAdmin123!}
    command: sh -c "npx prisma db push --skip-generate && npx prisma db seed"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://openwed:openwed@db:5432/openwed
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-production}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-super@admin.com}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-SuperAdmin123!}
      # Optional — without these, Chotu chat and email features are disabled:
      # RESEND_API_KEY: ${RESEND_API_KEY:-}
      # FROM_EMAIL: ${FROM_EMAIL:-}
      # GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # GROQ_API_KEY: ${GROQ_API_KEY:-}
      # GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      # NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
      # R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      # R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      # R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      # R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      # R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    ports:
      - "3000:3000"

volumes:
  db-data:
